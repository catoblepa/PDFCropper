name: Flatpak

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.catoblepa.PDFCropper.json
          bundle: io.github.catoblepa.PDFCropper.flatpak
          cache: true
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v7
        with:
          name: io.github.catoblepa.PDFCropper.flatpak
          path: io.github.catoblepa.PDFCropper.flatpak
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: io.github.catoblepa.PDFCropper.flatpak
